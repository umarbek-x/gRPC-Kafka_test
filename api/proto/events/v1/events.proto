// Integration events published to Kafka.
//
// Events are facts that already happened ("OrderCreated"), named in the past
// tense. They are the contract between services, so they follow the same
// compatibility rules as the gRPC API. They are serialized with protojson so
// they are human-readable in Kafka UI.
syntax = "proto3";

package orderflow.events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/umarbek-x/gRPC-Kafka_test/gen/go/events/v1;eventsv1";

// EventMetadata is embedded in every event.
message EventMetadata {
  // Unique per event. Consumers use it for de-duplication (idempotency).
  string event_id = 1;
  // Fully-qualified proto name, e.g. "orderflow.events.v1.OrderCreated".
  string event_type = 2;
  google.protobuf.Timestamp occurred_at = 3;
  // Follows a single business flow across services (gRPC call -> events).
  string correlation_id = 4;
  // Name of the service that produced the event.
  string producer = 5;
}

message LineItem {
  string product_id = 1;
  int32 quantity = 2;
  int64 unit_price_minor = 3;
}

// Topic: orders.v1, key: order_id
message OrderCreated {
  EventMetadata metadata = 1;
  string order_id = 2;
  string customer_id = 3;
  repeated LineItem items = 4;
  int64 total_minor = 5;
  string currency = 6;
}

// Topic: orders.v1, key: order_id
message OrderCancelled {
  EventMetadata metadata = 1;
  string order_id = 2;
  string customer_id = 3;
  string reason = 4;
}

// Topic: payments.v1, key: order_id
message PaymentCompleted {
  EventMetadata metadata = 1;
  string payment_id = 2;
  string order_id = 3;
  string customer_id = 4;
  int64 amount_minor = 5;
  string currency = 6;
}

// Topic: payments.v1, key: order_id
message PaymentFailed {
  EventMetadata metadata = 1;
  string payment_id = 2;
  string order_id = 3;
  string customer_id = 4;
  string reason = 5;
}

// Topic: payments.v1, key: order_id
message PaymentRefunded {
  EventMetadata metadata = 1;
  string payment_id = 2;
  string order_id = 3;
  string customer_id = 4;
  int64 amount_minor = 5;
  string currency = 6;
}
