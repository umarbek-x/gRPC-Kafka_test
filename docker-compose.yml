# Local environment for OrderFlow.
#
#   docker compose up -d                  -> infrastructure only (Postgres, Kafka, Kafka UI)
#   docker compose --profile apps up -d   -> infrastructure + the three services
#
# Host ports are deliberately non-standard so this stack never collides with
# other projects running on your machine:
#   Postgres 55432 | Kafka 19092 | Kafka UI 18080 | gRPC 50061 | ops 18081-18083
name: orderflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow # local development only
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on first start: creates one database per service.
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d payments"]
      interval: 3s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    # KRaft mode: Kafka manages its own metadata, no ZooKeeper needed.
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Three listeners:
      #   INTERNAL   - other containers connect to kafka:29092
      #   EXTERNAL   - programs on your machine (go run) connect to localhost:19092
      #   CONTROLLER - KRaft metadata quorum
      # A client first connects to a "bootstrap" address, then Kafka tells it
      # which address to use for each broker (the ADVERTISED listener). If the
      # advertised address is not reachable from the client, you get the
      # classic "connects, then times out" problem.
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # Single broker => replication factor 1. Production: 3 brokers, RF=3, min.insync.replicas=2.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (see kafka-init): a typo in a topic name
      # should be an error, not a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "19092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # One-shot job that creates the topics, then exits.
  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./deploy/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.0.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: orderflow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "18080:8080"

  # ---- application services (profile "apps") ------------------------------
  order-service:
    profiles: ["apps"]
    build:
      context: .
      args: { SERVICE: order-service }
    depends_on: &app-deps
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    environment:
      POSTGRES_DSN: postgres://orderflow:orderflow@postgres:5432/orders?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      GRPC_ADDR: ":50061"
      OPS_ADDR: ":18081"
    ports:
      - "50061:50061"
      - "18081:18081"
    restart: unless-stopped

  payment-service:
    profiles: ["apps"]
    build:
      context: .
      args: { SERVICE: payment-service }
    depends_on: *app-deps
    environment:
      POSTGRES_DSN: postgres://orderflow:orderflow@postgres:5432/payments?sslmode=disable
      KAFKA_BROKERS: kafka:29092
      OPS_ADDR: ":18082"
    ports:
      - "18082:18082"
    restart: unless-stopped

  notification-service:
    profiles: ["apps"]
    build:
      context: .
      args: { SERVICE: notification-service }
    depends_on:
      kafka-init: { condition: service_completed_successfully }
    environment:
      KAFKA_BROKERS: kafka:29092
      OPS_ADDR: ":18083"
    ports:
      - "18083:18083"
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
